
<!DOCTYPE html>
<html>
<head>
    <title>Online Book Library</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f3f5f7;
            color: #222;
        }

        header {
            background: red;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #ccc;
        }

        input, select {
            padding: 12px;
            margin: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        #search {
            width: 45%;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #003366;
            color: white;
            cursor: pointer;
        }

        #clearBtn {
            background: #777;
        }

        #bookList {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
            overflow-wrap: anywhere;
        }

        .book h2 {
            color: #003366;
        }

        .book p {
            line-height: 1.5;
        }

        #message {
            text-align: center;
            margin: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: yellow;
            color: darkgreen;
        }

        @media(max-width: 600px) {
            #search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Online Book Library</h1>
    <p>Book Search using jQuery AJAX and JSON ( Hypothetical API )</p>
</header>

<div class="container">

    <div class="search-box">
        <input type="text" id="search"
               placeholder="Search title, author or keyword">

        <select id="genre">
            <option value="">All Genres</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Programming">Programming</option>
            <option value="Algorithms">Algorithms</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="Database">Database</option>
            <option value="Fiction">Fiction</option>
            <option value="Autobiography">Autobiography</option>
            <option value="Web Development">Web Development</option>
        </select>

        <button id="searchBtn">Search Books</button>
        <button id="clearBtn">Clear</button>
    </div>

    <p id="message">Click Search Books to load the library.</p>

    <div id="bookList"></div>

</div>

<footer>
    Online Book Library | jQuery AJAX | JSON
</footer>

<script>
$(document).ready(function() {

    let books = [];

    function loadBooks() {
        $("#message").text("Loading books...");
        $("#bookList").empty();

        $.ajax({
            url: "books.json",
            type: "GET",
            dataType: "json",

            success: function(data) {
                books = data;
                displayBooks(books);
            },

            error: function() {
                $("#message").text(
                    "Unable to load books. Run this project using Live Server."
                );
            }
        });
    }

    function displayBooks(list) {
        $("#bookList").empty();

        if (list.length === 0) {
            $("#message").text("No books found.");
            return;
        }

        $("#message").text(
            "Found " + list.length + " book(s)."
        );

        $.each(list, function(index, book) {
            let card = $("<div>").addClass("book");

            $("<h2>").text(book.title).appendTo(card);
            $("<p>").text("Author: " + book.author).appendTo(card);
            $("<p>").text("Year: " + book.year).appendTo(card);
            $("<p>").text("Genre: " + book.genre).appendTo(card);
            $("<p>").text("Publisher: " + book.publisher).appendTo(card);
            $("<p>").text("Language: " + book.language).appendTo(card);
            $("<p>").text("Editions: " + book.editions).appendTo(card);
            $("<p>").text("ISBN: " + book.isbn).appendTo(card);
            $("<p>").text("Description: " + book.description).appendTo(card);

            $("#bookList").append(card);
        });
    }

    function searchBooks() {
        let query = $("#search").val().trim().toLowerCase();
        let genre = $("#genre").val();

        let filtered = books.filter(function(book) {
            let text = (
                book.title + " " +
                book.author + " " +
                book.publisher + " " +
                book.description
            ).toLowerCase();

            return text.includes(query) &&
                   (genre === "" || book.genre === genre);
        });

        displayBooks(filtered);
    }

    $("#searchBtn").click(function() {
        if (books.length === 0) {
            loadBooks();
        } else {
            searchBooks();
        }
    });

    $("#search").on("keyup", function() {
        if (books.length > 0) {
            searchBooks();
        }
    });

    $("#genre").change(function() {
        if (books.length > 0) {
            searchBooks();
        }
    });

    $("#clearBtn").click(function() {
        $("#search").val("");
        $("#genre").val("");

        if (books.length > 0) {
            displayBooks(books);
        } else {
            $("#bookList").empty();
            $("#message").text("Click Search Books to load the library.");
        }
    });

});
</script>

</body>
</html>
