<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Quiz App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Background Animation -->
    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>
    <div class="bg-circle circle3"></div>

    <div class="container">

        <!-- Start Screen -->
        <div id="start-screen" class="card">

            <i class="fa-solid fa-graduation-cap logo"></i>

            <h1>General Knowledge Quiz</h1>

            <p>
                Test your knowledge with <b>20 exciting questions</b>.
            </p>

            <button id="start-btn">
                Start Quiz
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>


        <!-- Quiz Screen -->
        <div id="quiz-screen" class="card hide">

            <!-- Top -->
            <div class="top">

                <h2>Question <span id="question-number">1</span> / 20</h2>

                <span id="score-box">
                    Score :
                    <span id="live-score">0</span>
                </span>

            </div>

            <!-- Progress -->
            <div class="progress-bar">

                <div id="progress"></div>

            </div>

            <!-- Question -->
            <h3 id="question">
                Loading...
            </h3>

            <!-- Options -->
            <div id="answer-buttons" class="btn-grid">

            </div>

            <!-- Next -->
            <button id="next-btn" class="hide">
                Next Question
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>


        <!-- Result Screen -->
        <div id="result-screen" class="card hide">

            <i class="fa-solid fa-trophy trophy"></i>

            <h1>Quiz Completed!</h1>

            <h2 id="final-score">
                0 / 20
            </h2>

            <h3 id="percentage">
                0%
            </h3>

            <p id="remark">
                Excellent!
            </p>

            <button id="restart-btn">
                <i class="fa-solid fa-rotate-right"></i>
                Restart Quiz
            </button>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
