<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="calculator">

<h2>Scientific Calculator</h2>

<div class="history" id="history"></div>

<input type="text" id="display" readonly>

<div class="buttons">

<button class="function" onclick="clearDisplay()">C</button>
<button class="function" onclick="backspace()">⌫</button>
<button class="function" onclick="append('%')">%</button>
<button class="operator" onclick="append('/')">÷</button>

<button class="scientific" onclick="appendFunction('Math.sin(')">sin</button>
<button class="scientific" onclick="appendFunction('Math.cos(')">cos</button>
<button class="scientific" onclick="appendFunction('Math.tan(')">tan</button>
<button class="operator" onclick="append('*')">×</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('-')">−</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="operator" onclick="append('+')">+</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="scientific" onclick="appendFunction('Math.sqrt(')">√</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button class="scientific" onclick="appendFunction('Math.log10(')">log</button>
<button class="scientific" onclick="appendFunction('Math.log(')">ln</button>

<button class="scientific" onclick="appendFunction('Math.pow(')">xʸ</button>
<button class="scientific" onclick="appendFunction('Math.PI')">π</button>
<button class="scientific" onclick="appendFunction('Math.E')">e</button>

<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
